name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set image tags
      id: meta
      run: |
        echo "IMAGE=ghcr.io/${{ github.repository }}/ai-saas" >> "$GITHUB_OUTPUT"
        echo "VERSION=$(date +%s)" >> "$GITHUB_OUTPUT"

    - name: Build Docker image
      run: |
        docker build \
          -t "${{ steps.meta.outputs.IMAGE }}:latest" \
          -t "${{ steps.meta.outputs.IMAGE }}:${{ steps.meta.outputs.VERSION }}" \
          .

    - name: Verify image tags
      run: |
        docker images
        docker image inspect \
          "${{ steps.meta.outputs.IMAGE }}:latest" \
          "${{ steps.meta.outputs.IMAGE }}:${{ steps.meta.outputs.VERSION }}"

    - name: Push Docker image (latest)
      run: docker push "${{ steps.meta.outputs.IMAGE }}:latest"

    - name: Push Docker image (versioned)
      run: docker push "${{ steps.meta.outputs.IMAGE }}:${{ steps.meta.outputs.VERSION }}"
      
